
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #01142F; overflow: hidden; }
    canvas { display: block; width: 2560px; height: 1440px; }
  </style>
</head>
<body>
  <canvas id="cv" width="2560" height="1440"></canvas>
  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // 1. Deep Midnight Cosmic Navy Gradient Base
    const baseGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 100, W * 0.5, H * 0.5, W * 0.85);
    baseGrad.addColorStop(0, '#032354');
    baseGrad.addColorStop(0.4, '#02183c');
    baseGrad.addColorStop(0.75, '#01122c');
    baseGrad.addColorStop(1, '#000c1e');
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. Large Volumetric Radiant Nebula Glows
    function drawGlow(x, y, r, color1, color2) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color1);
      g.addColorStop(0.5, color2);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    drawGlow(W * 0.5, -50, 1100, 'rgba(4, 146, 219, 0.42)', 'rgba(4, 116, 194, 0.15)');
    drawGlow(W * 0.12, H * 0.85, 950, 'rgba(50, 177, 91, 0.28)', 'rgba(35, 135, 74, 0.1)');
    drawGlow(W * 0.88, H * 0.45, 950, 'rgba(0, 210, 255, 0.3)', 'rgba(2, 63, 133, 0.15)');
    drawGlow(W * 0.5, H * 0.65, 800, 'rgba(2, 63, 133, 0.35)', 'transparent');

    // 3. Perspective Isometric Hex Lattice Floor (High-tech Chemical Grid)
    ctx.save();
    ctx.translate(W * 0.5, H * 0.98);
    ctx.scale(1, 0.38);
    const hexRadius = 75;
    const cols = 26;
    const rows = 12;
    for (let r = -rows; r <= 2; r++) {
      for (let c = -cols; c <= cols; c++) {
        const x = c * hexRadius * 1.732 + (r % 2 === 0 ? (hexRadius * 1.732) / 2 : 0);
        const y = r * hexRadius * 1.5;
        const dist = Math.sqrt(x * x + y * y);
        if (dist < 1800) {
          const alpha = Math.max(0, (1 - dist / 1800) * 0.22);
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 6;
            const hx = x + hexRadius * Math.cos(angle);
            const hy = y + hexRadius * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(4, 146, 219, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // 4. Luminous Chemical Stream Wave Ribbon (Procurement Journey Energy Arc)
    for (let layer = 0; layer < 4; layer++) {
      ctx.save();
      ctx.beginPath();
      const waveGrad = ctx.createLinearGradient(0, 0, W, 0);
      waveGrad.addColorStop(0, 'rgba(4, 116, 194, 0)');
      waveGrad.addColorStop(0.18, 'rgba(4, 146, 219, 0.4)');
      waveGrad.addColorStop(0.48, 'rgba(0, 240, 255, 0.65)');
      waveGrad.addColorStop(0.82, 'rgba(50, 177, 91, 0.5)');
      waveGrad.addColorStop(1, 'rgba(50, 177, 91, 0)');

      ctx.strokeStyle = waveGrad;
      ctx.lineWidth = 3.5 - layer * 0.6;
      ctx.shadowBlur = 24 - layer * 4;
      ctx.shadowColor = layer % 2 === 0 ? '#00f0ff' : '#32b15b';

      const baseY = H * 0.44 + layer * 32;
      ctx.moveTo(-100, baseY);
      for (let x = -100; x <= W + 100; x += 30) {
        const y = baseY + 
                  Math.sin(x * 0.0018 + layer * 0.9) * 110 + 
                  Math.cos(x * 0.0009 - layer * 0.5) * 60;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 5. 3D Molecular Compound Clusters with Glowing Atomic Bonds
    function drawMolecule(cx, cy, radius, rot, alpha, ringType = 'benzene') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      // Outer Glow Aura
      const aura = ctx.createRadialGradient(0, 0, 10, 0, 0, radius * 2.2);
      aura.addColorStop(0, `rgba(4, 146, 219, ${alpha * 0.25})`);
      aura.addColorStop(1, 'transparent');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // Hexagon ring
      ctx.beginPath();
      const nodes = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const nx = radius * Math.cos(angle);
        const ny = radius * Math.sin(angle);
        nodes.push({ x: nx, y: ny, angle });
        if (i === 0) ctx.moveTo(nx, ny);
        else ctx.lineTo(nx, ny);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(4, 146, 219, ${alpha * 0.12})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(0, 240, 255, ${alpha * 0.85})`;
      ctx.lineWidth = 2.4;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#04d9ff';
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Inner aromatic ring or alternating double bonds
      if (ringType === 'benzene') {
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.62, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(4, 146, 219, ${alpha * 0.55})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Vertices (Atoms)
      nodes.forEach((n, idx) => {
        // Double bond markers on alternating sides
        if (idx % 2 === 0 && ringType !== 'benzene') {
          const next = nodes[(idx + 1) % 6];
          ctx.beginPath();
          ctx.moveTo(n.x * 0.82, n.y * 0.82);
          ctx.lineTo(next.x * 0.82, next.y * 0.82);
          ctx.strokeStyle = `rgba(0, 240, 255, ${alpha * 0.7})`;
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        // Branching bond
        if (idx % 2 === 1 || idx === 0) {
          const branchLen = radius * 0.7;
          const bx = (radius + branchLen) * Math.cos(n.angle);
          const by = (radius + branchLen) * Math.sin(n.angle);
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(bx, by);
          ctx.strokeStyle = `rgba(4, 146, 219, ${alpha * 0.75})`;
          ctx.lineWidth = 2.2;
          ctx.stroke();

          // Terminal atom sphere (Cyan or Green)
          const isGreen = idx === 0;
          const termGrad = ctx.createRadialGradient(bx - 3, by - 3, 1, bx, by, 9);
          if (isGreen) {
            termGrad.addColorStop(0, '#ffffff');
            termGrad.addColorStop(0.35, '#56ea84');
            termGrad.addColorStop(0.8, '#32b15b');
            termGrad.addColorStop(1, '#1b6333');
          } else {
            termGrad.addColorStop(0, '#ffffff');
            termGrad.addColorStop(0.35, '#00f0ff');
            termGrad.addColorStop(0.8, '#0474c2');
            termGrad.addColorStop(1, '#023f85');
          }
          ctx.fillStyle = termGrad;
          ctx.beginPath();
          ctx.arc(bx, by, 8.5, 0, Math.PI * 2);
          ctx.shadowBlur = 14;
          ctx.shadowColor = isGreen ? '#32b15b' : '#00f0ff';
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Ring Node Atom Sphere
        const atomGrad = ctx.createRadialGradient(n.x - 3, n.y - 3, 1, n.x, n.y, 8);
        atomGrad.addColorStop(0, '#ffffff');
        atomGrad.addColorStop(0.4, '#00d4ff');
        atomGrad.addColorStop(0.85, '#023f85');
        atomGrad.addColorStop(1, '#011c40');
        ctx.fillStyle = atomGrad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, 7.5, 0, Math.PI * 2);
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#04d9ff';
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      ctx.restore();
    }

    // Prominent artistic molecular clusters positioned creatively
    const molecules = [
      // Left side hero cluster
      { x: W * 0.12, y: H * 0.28, r: 84, rot: 0.3, a: 0.85, type: 'benzene' },
      { x: W * 0.22, y: H * 0.16, r: 56, rot: -0.5, a: 0.7, type: 'double' },
      { x: W * 0.07, y: H * 0.65, r: 105, rot: 0.6, a: 0.75, type: 'benzene' },
      
      // Right side hero cluster
      { x: W * 0.86, y: H * 0.24, r: 92, rot: -0.4, a: 0.88, type: 'benzene' },
      { x: W * 0.94, y: H * 0.45, r: 64, rot: 0.25, a: 0.72, type: 'double' },
      { x: W * 0.83, y: H * 0.74, r: 98, rot: -0.2, a: 0.8, type: 'benzene' },

      // Subtle background floating nodes
      { x: W * 0.48, y: H * 0.12, r: 48, rot: 0.15, a: 0.45, type: 'benzene' },
      { x: W * 0.36, y: H * 0.88, r: 58, rot: -0.3, a: 0.5, type: 'benzene' },
      { x: W * 0.64, y: H * 0.89, r: 52, rot: 0.4, a: 0.48, type: 'double' },
    ];

    molecules.forEach(m => drawMolecule(m.x, m.y, m.r, m.rot, m.a, m.type));

    // 6. Connective Constellation Lines between Molecular Nodes
    ctx.save();
    for (let i = 0; i < molecules.length; i++) {
      for (let j = i + 1; j < molecules.length; j++) {
        const dx = molecules[i].x - molecules[j].x;
        const dy = molecules[i].y - molecules[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 450) {
          ctx.beginPath();
          ctx.moveTo(molecules[i].x, molecules[i].y);
          ctx.lineTo(molecules[j].x, molecules[j].y);
          ctx.strokeStyle = 'rgba(4, 146, 219, 0.2)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([6, 8]);
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // 7. Glowing Bokeh Particles & Sparkles
    for (let k = 0; k < 60; k++) {
      const px = Math.random() * W;
      const py = Math.random() * H;
      const pr = Math.random() * 5 + 1.5;
      const isGreen = Math.random() < 0.25;

      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fillStyle = isGreen ? 'rgba(86, 234, 132, 0.8)' : 'rgba(180, 240, 255, 0.85)';
      ctx.shadowBlur = pr * 3.5;
      ctx.shadowColor = isGreen ? '#32b15b' : '#00f0ff';
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 8. Depth-of-Field Large Floating Bokeh Orbs
    for (let b = 0; b < 24; b++) {
      const bx = Math.random() * W;
      const by = Math.random() * H;
      const br = Math.random() * 55 + 20;
      const bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      const col = b % 3 === 0 ? 'rgba(50, 177, 91, 0.12)' : 'rgba(4, 146, 219, 0.16)';
      bg.addColorStop(0, col);
      bg.addColorStop(0.7, col.replace('0.12', '0.04').replace('0.16', '0.04'));
      bg.addColorStop(1, 'transparent');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }

    // 9. Refined Center Vignette so Process Cards have supreme contrast and readability
    const centerVig = ctx.createRadialGradient(W * 0.5, H * 0.52, W * 0.2, W * 0.5, H * 0.52, W * 0.65);
    centerVig.addColorStop(0, 'rgba(1, 20, 47, 0.05)');
    centerVig.addColorStop(0.55, 'rgba(1, 18, 43, 0.55)');
    centerVig.addColorStop(1, 'rgba(0, 10, 26, 0.92)');
    ctx.fillStyle = centerVig;
    ctx.fillRect(0, 0, W, H);
  </script>
</body>
</html>
