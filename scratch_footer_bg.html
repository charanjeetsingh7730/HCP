
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #011129; overflow: hidden; }
    canvas { display: block; width: 2560px; height: 1100px; }
  </style>
</head>
<body>
  <canvas id="cv" width="2560" height="1100"></canvas>
  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // 1. Deep Midnight Cosmic Navy Base
    const baseGrad = ctx.createLinearGradient(0, 0, W, H);
    baseGrad.addColorStop(0, '#011129');
    baseGrad.addColorStop(0.35, '#01193d');
    baseGrad.addColorStop(0.7, '#02214f');
    baseGrad.addColorStop(1, '#010c1e');
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. Volumetric Glows
    function drawGlow(x, y, r, color1, color2) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color1);
      g.addColorStop(0.5, color2);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Top subtle brand aurora
    drawGlow(W * 0.5, 0, 950, 'rgba(4, 146, 219, 0.35)', 'rgba(2, 63, 133, 0.12)');
    // Bottom-right bio-emerald glow
    drawGlow(W * 0.9, H * 0.85, 800, 'rgba(50, 177, 91, 0.25)', 'rgba(35, 135, 74, 0.08)');
    // Bottom-left cyan crystal glow
    drawGlow(W * 0.1, H * 0.85, 750, 'rgba(4, 146, 219, 0.28)', 'rgba(0, 240, 255, 0.06)');

    // 3. Perspective Hexagonal Lattice at bottom
    ctx.save();
    ctx.translate(W * 0.5, H * 1.05);
    ctx.scale(1, 0.32);
    const hexRadius = 80;
    const cols = 24;
    const rows = 10;
    for (let r = -rows; r <= 2; r++) {
      for (let c = -cols; c <= cols; c++) {
        const x = c * hexRadius * 1.732 + (r % 2 === 0 ? (hexRadius * 1.732) / 2 : 0);
        const y = r * hexRadius * 1.5;
        const dist = Math.sqrt(x * x + y * y);
        if (dist < 1800) {
          const alpha = Math.max(0, (1 - dist / 1800) * 0.18);
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 6;
            const hx = x + hexRadius * Math.cos(angle);
            const hy = y + hexRadius * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(4, 146, 219, ${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // 4. Flowing Glowing Bio-chemical Energy Waves across the footer
    for (let j = 0; j < 3; j++) {
      ctx.save();
      ctx.beginPath();
      const waveGrad = ctx.createLinearGradient(0, 0, W, 0);
      waveGrad.addColorStop(0, 'rgba(4, 116, 194, 0)');
      waveGrad.addColorStop(0.2, 'rgba(4, 146, 219, 0.35)');
      waveGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.55)');
      waveGrad.addColorStop(0.8, 'rgba(50, 177, 91, 0.45)');
      waveGrad.addColorStop(1, 'rgba(50, 177, 91, 0)');

      ctx.strokeStyle = waveGrad;
      ctx.lineWidth = 3 - j * 0.6;
      ctx.shadowBlur = 20 - j * 4;
      ctx.shadowColor = j === 1 ? '#00f0ff' : '#32b15b';

      const baseY = H * 0.22 + j * 38;
      ctx.moveTo(-100, baseY);
      for (let x = -100; x <= W + 100; x += 30) {
        const y = baseY + Math.sin(x * 0.002 + j * 1.1) * 75 + Math.cos(x * 0.001 - j) * 40;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // 5. Molecular Ring Compounds
    function drawMolecule(cx, cy, radius, rot, alpha) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      ctx.beginPath();
      const nodes = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const nx = radius * Math.cos(angle);
        const ny = radius * Math.sin(angle);
        nodes.push({ x: nx, y: ny, angle });
        if (i === 0) ctx.moveTo(nx, ny);
        else ctx.lineTo(nx, ny);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(4, 146, 219, ${alpha * 0.08})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(0, 240, 255, ${alpha * 0.7})`;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#04d9ff';
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Inner resonance
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(4, 146, 219, ${alpha * 0.45})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Nodes
      nodes.forEach((n, idx) => {
        const atomGrad = ctx.createRadialGradient(n.x - 2, n.y - 2, 1, n.x, n.y, 6);
        atomGrad.addColorStop(0, '#ffffff');
        atomGrad.addColorStop(0.4, '#00d4ff');
        atomGrad.addColorStop(0.85, '#023f85');
        atomGrad.addColorStop(1, '#011c40');
        ctx.fillStyle = atomGrad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
        ctx.fill();

        if (idx === 0 || idx === 3) {
          const bx = (radius + 32) * Math.cos(n.angle);
          const by = (radius + 32) * Math.sin(n.angle);
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(bx, by);
          ctx.strokeStyle = `rgba(4, 146, 219, ${alpha * 0.6})`;
          ctx.lineWidth = 1.8;
          ctx.stroke();

          const isGreen = idx === 0;
          const tg = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, 7);
          tg.addColorStop(0, '#ffffff');
          tg.addColorStop(0.4, isGreen ? '#56ea84' : '#00f0ff');
          tg.addColorStop(0.9, isGreen ? '#32b15b' : '#0474c2');
          tg.addColorStop(1, '#011c40');
          ctx.fillStyle = tg;
          ctx.beginPath();
          ctx.arc(bx, by, 6.5, 0, Math.PI * 2);
          ctx.shadowBlur = 12;
          ctx.shadowColor = isGreen ? '#32b15b' : '#00f0ff';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
      ctx.restore();
    }

    // Place subtle molecules around edges
    drawMolecule(W * 0.08, H * 0.38, 70, 0.4, 0.7);
    drawMolecule(W * 0.18, H * 0.18, 48, -0.3, 0.5);
    drawMolecule(W * 0.92, H * 0.34, 76, -0.4, 0.75);
    drawMolecule(W * 0.84, H * 0.68, 58, 0.2, 0.55);
    drawMolecule(W * 0.05, H * 0.78, 64, 0.5, 0.45);

    // 6. Glowing Bokeh Particles
    for (let k = 0; k < 50; k++) {
      const px = Math.random() * W;
      const py = Math.random() * H;
      const pr = Math.random() * 4 + 1.2;
      const isGreen = Math.random() < 0.28;

      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fillStyle = isGreen ? 'rgba(86, 234, 132, 0.75)' : 'rgba(180, 240, 255, 0.8)';
      ctx.shadowBlur = pr * 3;
      ctx.shadowColor = isGreen ? '#32b15b' : '#00f0ff';
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 7. Soft Vignette so text is 100% crystal legible
    const vig = ctx.createLinearGradient(0, 0, 0, H);
    vig.addColorStop(0, 'rgba(1, 17, 41, 0.1)');
    vig.addColorStop(0.3, 'rgba(1, 17, 41, 0.4)');
    vig.addColorStop(0.85, 'rgba(1, 14, 34, 0.75)');
    vig.addColorStop(1, 'rgba(1, 12, 30, 0.92)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  </script>
</body>
</html>
